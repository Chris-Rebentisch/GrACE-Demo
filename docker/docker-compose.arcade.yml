services:
  arcadedb:
    image: arcadedata/arcadedb-minimal:26.5.1
    container_name: grace-arcadedb
    # Loopback only: ArcadeDB Studio / REST (2480) and the binary protocol
    # (2424) are reachable from this machine only. If you really need wider
    # binding, add a docker-compose.override.yml (gitignored) — do not edit here.
    ports:
      - "127.0.0.1:2480:2480"   # HTTP/REST API + Studio (login root / gracedev)
      - "127.0.0.1:2424:2424"   # Binary protocol
    volumes:
      # Named Docker volume — the portable default (macOS / Windows / Linux, no
      # host-path or permissions assumptions; survives container recreation).
      # NOTE: the 26.x image keeps its data under /home/arcadedb/databases.
      # Want the data host-visible? Bind-mount via docker-compose.override.yml:
      #   services:
      #     arcadedb:
      #       volumes:
      #         - "/absolute/path/on/host/arcadedb:/home/arcadedb/databases"
      - grace_arcadedb_data:/home/arcadedb/databases
    # Raise the open-file cap from the Linux default (1024): ArcadeDB holds an
    # fd per socket / index file / bucket and wedges at HTTP 000 when it runs out.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Root password comes from .env (ARCADE_PASSWORD) — dev default gracedev.
      # vectorIndex.graphBuildCacheSize bounds RAM per vector-index rebuild.
      JAVA_OPTS: >-
        -Darcadedb.server.rootPassword=${ARCADE_PASSWORD:-gracedev}
        -Darcadedb.vectorIndex.graphBuildCacheSize=${ARCADE_VECTOR_CACHE:-10000}
      # JVM heap. Student-laptop default: 1–3 GB (fits a 4 GB Docker VM).
      # The heap is controlled HERE (the image appends ARCADEDB_OPTS_MEMORY after
      # JAVA_OPTS, so any -Xmx in JAVA_OPTS would be overridden). Bigger corpus /
      # bigger machine: set ARCADE_HEAP in .env, e.g. ARCADE_HEAP="-Xms4G -Xmx8g".
      ARCADEDB_OPTS_MEMORY: "${ARCADE_HEAP:--Xms1G -Xmx3g}"
      # No multi-GB heap dumps on OOM (they wedge the server and fill the disk).
      ARCADEDB_JMX: "-XX:-HeapDumpOnOutOfMemoryError"
    restart: unless-stopped

volumes:
  grace_arcadedb_data:
