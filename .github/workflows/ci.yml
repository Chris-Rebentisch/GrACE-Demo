name: CI

# GrACE-Demo: keep this green. No Grafana, no live data, no paid LLM calls.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-migration-revision-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/lint/check-migration-revision-ids.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra dev
      # Tier-1 (no DB / no services) slices that guard the demo's load-bearing paths.
      - run: >
          uv run pytest -q --tb=line
          tests/shared/test_embeddings.py
          tests/shared/test_embed_timeout_configurable.py
          tests/shared/test_llm_provider.py
          tests/shared/test_anthropic_provider.py
          tests/retrieval/test_reranker.py
          tests/retrieval/test_semantic_strategy.py
          tests/eval/test_golden_loader.py
          tests/docker

  demo-loop:
    # The whole student path: migrate → API → smoke → fast path (samples, no LLM call).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grace_demo
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      arcadedb:
        image: arcadedata/arcadedb-minimal:26.5.1
        env:
          JAVA_OPTS: -Darcadedb.server.rootPassword=gracedev
          ARCADEDB_OPTS_MEMORY: -Xms512M -Xmx1500M
        ports:
          - 2480:2480
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --extra dev
      - name: Write .env for the CI stack
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql+psycopg2://postgres:testpass@localhost:5432/grace_demo#' .env
          sed -i 's#^LLM_API_KEY=.*#LLM_API_KEY=sk-ant-test-key-not-real#' .env
      - name: Wait for ArcadeDB and create the demo database
        run: |
          for i in $(seq 1 60); do
            curl -fsS -u root:gracedev http://localhost:2480/api/v1/server >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS -u root:gracedev -X POST http://localhost:2480/api/v1/server \
            -H 'Content-Type: application/json' -d '{"command":"create database grace_demo"}'
      - run: uv run alembic upgrade head
      - name: Start the API
        run: |
          nohup uv run uvicorn src.api.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/api/health
      - run: bash scripts/smoke-demo.sh
      - run: bash scripts/demo-fastpath.sh
      - name: API log on failure
        if: failure()
        run: tail -n 200 api.log
